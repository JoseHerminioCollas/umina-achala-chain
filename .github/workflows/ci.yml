name: Tests

# Run the test suite on every push to any branch, and on pull requests
# (pull requests from forks do not trigger push events in this repo).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Hedera and IPFS are mocked, so no secrets or .env files are needed.
      - run: npm test

      # Check the example metadata against the HIP-412 schema.
      - run: npm run validate
